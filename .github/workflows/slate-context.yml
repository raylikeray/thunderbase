name: Daily slate context
on:
  schedule:
    - cron: '17 13 * * *'   # 8:17 AM CT (CDT) / 7:17 AM CT (CST)
  workflow_dispatch:
  push:
    paths: ['ai/.refresh']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node tools/slate-context.mjs
      - run: |
          git config user.name "thunderbase-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ai/
          git diff --cached --quiet || git commit -m "Slate context for $(TZ=America/Chicago date +%F)"
          git pull --rebase && git push
