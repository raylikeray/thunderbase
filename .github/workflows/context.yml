name: Daily AI context
on:
  schedule:
    - cron: '17 13 * * *'   # 8:17 AM CDT / 7:17 AM CST
  workflow_dispatch:
  push:
    paths: ['ai/.refresh']
permissions:
  contents: write
concurrency: { group: hardwood-data, cancel-in-progress: false }
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node tools/nightly.mjs context
      - run: |
          git config user.name "hardwood-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ai/
          git diff --cached --quiet || git commit -m "AI context for $(TZ=America/Chicago date +%F)"
          git pull --rebase && git push
