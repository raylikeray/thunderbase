name: Probe a feed
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Feed URL to describe'
        required: true
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node tools/probe.mjs "${{ inputs.url }}"
